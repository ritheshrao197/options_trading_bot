name: Scheduled Live Paper Trader

on:
  schedule:
    # Runs Monday through Friday at 04:00 UTC (09:30 IST market opening)
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

jobs:
  paper-trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading_bot/requirements.txt

      - name: Execute Paper Trading Loop against Real Market Stream
        run: |
          cd trading_bot
          python main.py paper --symbol ^NSEI --ticks 20 --interval 3.0
